[project]
name = "tatort-dl"
version = "0.1.1"
description = "Downloader for Tatort movies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "platformdirs>=4.5.1",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "yt-dlp>=2025.12.8",
]

[dependency-groups]
dev = [
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-requests>=2.32.4.20250913",
]

[project.scripts]
tatort-dl = "tatort_dl:main"

[tool.setuptools.packages.find]
include = ["tatort_dl*"]